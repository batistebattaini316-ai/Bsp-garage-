<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS Performance — Garage</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --or: #C9A84C;
    --or2: #f0c44a;
    --noir: #0f0f0f;
    --noir2: #1a1a1a;
    --noir3: #252525;
    --gris: #333;
    --gris2: #555;
    --texte: #e8e8e8;
    --texte2: #aaa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--noir); color: var(--texte); font-family: 'Barlow', sans-serif; min-height: 100vh; overflow-x: hidden; }

  /* LOGIN */
  .login-screen { position: fixed; inset: 0; background: var(--noir); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; }
  .login-screen.hidden { display: none; }
  .login-sub { font-size: 11px; color: var(--texte2); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 36px; }
  .login-box { background: var(--noir2); border: 1px solid var(--gris); border-top: 3px solid var(--or); border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 360px; }
  .login-error { color: #e74c3c; font-size: 13px; text-align: center; margin-bottom: 12px; display: none; }
  .login-error.show { display: block; }

  /* HEADER */
  header { background: var(--noir2); border-bottom: 3px solid var(--or); padding: 6px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }

  /* BREADCRUMB */
  .breadcrumb { padding: 10px 20px 0; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--texte2); }
  .breadcrumb span { color: var(--or); cursor: pointer; }
  .breadcrumb span:hover { text-decoration: underline; }

  /* TOOLBAR */
  .toolbar { padding: 12px 20px; display: flex; gap: 10px; }
  .search-box { flex: 1; background: var(--noir3); border: 1px solid var(--gris); border-radius: 10px; padding: 10px 14px; color: var(--texte); font-family: 'Barlow', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
  .search-box:focus { border-color: var(--or); }
  .search-box::placeholder { color: var(--gris2); }
  .btn-add { background: var(--or); color: var(--noir); border: none; border-radius: 10px; padding: 10px 18px; font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; cursor: pointer; transition: background 0.2s, transform 0.1s; white-space: nowrap; }
  .btn-add:active { transform: scale(0.96); }

  /* FILTRES */
  .filtres { padding: 0 20px 12px; display: flex; gap: 8px; overflow-x: auto; }
  .filtre-btn { background: var(--noir3); border: 1px solid var(--gris); color: var(--texte2); border-radius: 20px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
  .filtre-btn.active { background: var(--or); color: var(--noir); border-color: var(--or); }

  /* CARDS */
  .cards-list { padding: 0 20px 100px; display: flex; flex-direction: column; gap: 10px; }

  /* CLIENT CARD */
  .client-card { background: var(--noir2); border: 1px solid var(--gris); border-left: 4px solid var(--or); border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between; }
  .client-card:active { transform: scale(0.98); }
  .client-card:hover { border-color: var(--or); background: var(--noir3); }
  .client-info h3 { font-size: 16px; font-weight: 600; color: var(--texte); margin-bottom: 4px; }
  .client-meta { font-size: 11px; color: var(--texte2); margin-top: 4px; }
  .client-arrow { color: var(--or); font-size: 20px; opacity: 0.6; }

  /* VEHICULE CARD */
  .vehicule-card { background: var(--noir2); border: 1px solid var(--gris); border-left: 4px solid #4a90d9; border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between; }
  .vehicule-card:hover { background: var(--noir3); }
  .vehicule-card:active { transform: scale(0.98); }
  .veh-plate { display: inline-block; background: var(--noir); border: 1.5px solid var(--or); color: var(--or); font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 2px; padding: 2px 10px; border-radius: 4px; margin-bottom: 4px; }
  .veh-info h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .veh-meta { font-size: 11px; color: var(--texte2); margin-top: 3px; }

  /* SECTION TITLE */
  .section-header { padding: 0 20px 10px; display: flex; align-items: center; justify-content: space-between; }
  .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 2px; color: var(--or); }

  /* FICHE CLIENT */
  .page { display: none; }
  .page.active { display: block; }

  /* INTERVENTIONS */
  .interv-card { background: var(--noir3); border: 1px solid var(--gris); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .interv-head { padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .interv-head:hover { background: rgba(201,168,76,0.06); }
  .interv-date { font-size: 12px; color: var(--or); font-weight: 600; }
  .interv-title-text { font-size: 15px; font-weight: 500; margin-top: 2px; }
  .interv-chevron { color: var(--texte2); font-size: 16px; transition: transform 0.2s; }
  .interv-chevron.open { transform: rotate(180deg); }
  .interv-body { display: none; padding: 0 14px 14px; border-top: 1px solid var(--gris); }
  .interv-body.open { display: block; }
  .interv-detail { font-size: 13px; color: var(--texte2); white-space: pre-wrap; margin: 10px 0; line-height: 1.6; }
  .interv-docs { margin-top: 10px; }
  .interv-actions { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .btn-edit-interv { background: none; border: 1px solid var(--or); color: var(--or); border-radius: 8px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
  .btn-del-interv { background: none; border: none; color: #c0392b; cursor: pointer; font-size: 13px; }

  /* BADGES STATUT */
  .badge-statut { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-top: 4px; letter-spacing: 0.5px; }
  .statut-afaire { background: #3a1a1a; color: #e74c3c; border: 1px solid #e74c3c44; }
  .statut-encours { background: #3a2e00; color: #f0c44a; border: 1px solid #f0c44a44; }
  .statut-termine { background: #1a3a1a; color: #2ecc71; border: 1px solid #2ecc7144; }

  /* BADGE GENERIQUE */
  .badge { background: var(--gris); color: var(--texte2); font-size: 11px; padding: 2px 8px; border-radius: 20px; margin-top: 4px; display: inline-block; }

  /* DOC */
  .doc-item { display: flex; align-items: center; gap: 8px; background: var(--noir2); border: 1px solid var(--gris); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; font-size: 13px; }
  .doc-item a { color: var(--or); text-decoration: none; flex: 1; }
  .btn-del-doc { background: none; border: none; color: #c0392b; cursor: pointer; font-size: 16px; }

  /* EMPTY */
  .empty { text-align: center; padding: 60px 20px; color: var(--texte2); }
  .empty-icon { font-size: 50px; margin-bottom: 12px; }
  .empty h3 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--gris2); letter-spacing: 1px; }

  /* LOADING */
  .loading { text-align: center; padding: 60px 20px; color: var(--texte2); font-size: 14px; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--gris); border-top-color: var(--or); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* INFO BOX */
  .info-box { background: var(--noir3); border: 1px solid var(--gris); border-radius: 12px; padding: 16px; margin: 0 20px 16px; }
  .info-box-title { font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 2px; color: var(--or); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .info-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--gris); }
  .info-row:last-child { border-bottom: none; }
  .info-row span:first-child { color: var(--texte2); }
  .info-row span:last-child { color: var(--texte); font-weight: 500; }

  /* FORM MODAL */
  .form-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 300; align-items: flex-end; }
  .form-modal.active { display: flex; }
  .form-sheet { background: var(--noir2); border-top: 3px solid var(--or); border-radius: 20px 20px 0 0; padding: 24px 20px 40px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .form-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; color: var(--or); margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; }
  .btn-close-modal { background: none; border: none; color: var(--texte2); font-size: 24px; cursor: pointer; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; color: var(--texte2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
  .form-group input, .form-group textarea, .form-group select { width: 100%; background: var(--noir3); border: 1px solid var(--gris); border-radius: 10px; padding: 11px 14px; color: var(--texte); font-family: 'Barlow', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
  .form-group input:focus, .form-group textarea:focus { border-color: var(--or); }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .btn-submit { width: 100%; background: var(--or); color: var(--noir); border: none; border-radius: 12px; padding: 14px; font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; cursor: pointer; margin-top: 6px; transition: background 0.2s, transform 0.1s; }
  .btn-submit:active { transform: scale(0.98); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

  /* UPLOAD */
  .upload-zone { border: 2px dashed var(--gris2); border-radius: 10px; padding: 16px; text-align: center; color: var(--texte2); font-size: 13px; cursor: pointer; transition: border-color 0.2s; margin-top: 8px; }
  .upload-zone:hover { border-color: var(--or); color: var(--or); }
  .upload-zone input { display: none; }

  /* BTN DANGER */
  .btn-danger { background: none; border: 1px solid #c0392b; color: #c0392b; border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; width: 100%; margin-top: 8px; }

  /* TOAST */
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--or); color: var(--noir); font-weight: 700; padding: 10px 24px; border-radius: 30px; font-size: 14px; z-index: 999; transition: transform 0.3s; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* BULLE NOTES */
  .notes-fab { position: fixed; bottom: 24px; right: 20px; width: 52px; height: 52px; background: var(--or); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; z-index: 200; box-shadow: 0 4px 16px rgba(201,168,76,0.4); transition: transform 0.2s; border: none; }
  .notes-fab:active { transform: scale(0.92); }
  .notes-fab .notes-badge { position: absolute; top: -4px; right: -4px; background: #e74c3c; color: #fff; font-size: 10px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
  .notes-panel { position: fixed; bottom: 90px; right: 16px; width: calc(100vw - 32px); max-width: 380px; background: var(--noir2); border: 1px solid var(--gris); border-top: 3px solid var(--or); border-radius: 16px; z-index: 200; display: none; box-shadow: 0 8px 32px rgba(0,0,0,0.6); max-height: 70vh; overflow: hidden; flex-direction: column; }
  .notes-panel.open { display: flex; }
  .notes-panel-header { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--gris); }
  .notes-panel-title { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px; color: var(--or); }
  .notes-list { overflow-y: auto; flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .note-item { background: var(--noir3); border: 1px solid var(--gris); border-radius: 10px; padding: 10px 12px; }
  .note-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .note-author { font-size: 11px; font-weight: 700; color: var(--or); }
  .note-date { font-size: 10px; color: var(--texte2); }
  .note-text { font-size: 13px; color: var(--texte); line-height: 1.5; white-space: pre-wrap; }
  .note-del { background: none; border: none; color: #c0392b; cursor: pointer; font-size: 14px; padding: 0 4px; }
  .notes-input-area { padding: 10px; border-top: 1px solid var(--gris); display: flex; gap: 8px; align-items: flex-end; }
  .notes-input-area textarea { flex: 1; background: var(--noir3); border: 1px solid var(--gris); border-radius: 10px; padding: 8px 12px; color: var(--texte); font-family: 'Barlow', sans-serif; font-size: 13px; resize: none; outline: none; min-height: 38px; max-height: 100px; }
  .notes-input-area textarea:focus { border-color: var(--or); }
  .btn-send-note { background: var(--or); border: none; border-radius: 10px; width: 38px; height: 38px; cursor: pointer; font-size: 16px; flex-shrink: 0; }
  .notes-empty { text-align: center; padding: 24px; color: var(--texte2); font-size: 13px; }

  /* DB STATUS */
  .db-status { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
  .db-ok { background: #1a3a1a; color: #4caf50; }
  .db-err { background: #3a1a1a; color: #f44336; }

  .header-count { background: var(--or); color: var(--noir); font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 20px; }

  .no-interv { color: var(--texte2); font-size: 13px; text-align: center; padding: 20px; }
  .divider { height: 1px; background: var(--gris); margin: 16px 0; }

  .btn-back { background: none; border: none; color: var(--or); font-size: 22px; cursor: pointer; padding: 4px; }
  .btn-delete-red { background: none; border: none; color: #c0392b; font-size: 20px; cursor: pointer; padding: 4px; }

  .page-header { background: var(--noir); border-bottom: 3px solid var(--or); padding: 14px 20px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 10; }
  .page-header-title { flex: 1; }
  .page-header-title h2 { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; }
  .page-header-title p { font-size: 12px; color: var(--or); letter-spacing: 1px; margin-top: 2px; }
</style>
</head>

<!-- PAGE 2 : FICHE CLIENT + VÉHICULES                       -->
<!-- ═══════════════════════════════════════════════════════ -->
<div id="pageClient" class="page">
  <div class="page-header">
    <button class="btn-back" onclick="goTo('pageClients')">&#8592;</button>
    <div class="page-header-title">
      <h2 id="clientNom">—</h2>
      <p id="clientMeta">—</p>
    </div>
    <button class="btn-delete-red" onclick="deleteClient()" title="Supprimer">🗑</button>
  </div>

  <!-- Infos client -->
  <div class="info-box" id="clientInfoBox"></div>

  <!-- Véhicules -->
  <div class="section-header">
    <div class="section-title">🚗 VÉHICULES</div>
    <button class="btn-add" style="font-size:14px;padding:7px 14px" onclick="openModal('modalVehicule')">+ VÉHICULE</button>
  </div>
  <div class="cards-list" id="vehiculesList" style="padding-top:0"></div>
</div>

<!-- ═══════════════════════════════════════════════════════ -->
<!-- PAGE 3 : FICHE VÉHICULE + INTERVENTIONS                 -->
<!-- ═══════════════════════════════════════════════════════ -->
<div id="pageVehicule" class="page">
  <div class="page-header">
    <button class="btn-back" onclick="goTo('pageClient')">&#8592;</button>
    <div class="page-header-title">
      <h2 id="vehNom">—</h2>
      <p id="vehPlaque">—</p>
    </div>
    <button class="btn-delete-red" onclick="deleteVehicule()" title="Supprimer">🗑</button>
  </div>

  <!-- Infos véhicule -->
  <div class="info-box" id="vehInfoBox"></div>

  <!-- Filtres statut -->
  <div class="filtres">
    <button class="filtre-btn active" onclick="setFiltre('tous', event)">🔍 Tous</button>
    <button class="filtre-btn" onclick="setFiltre('afaire', event)">🔴 À faire</button>
    <button class="filtre-btn" onclick="setFiltre('encours', event)">🟡 En cours</button>
    <button class="filtre-btn" onclick="setFiltre('termine', event)">🟢 Terminés</button>
  </div>

  <!-- Interventions -->
  <div class="section-header">
    <div class="section-title">🔧 INTERVENTIONS</div>
    <button class="btn-add" style="font-size:14px;padding:7px 14px" onclick="openModal('modalInterv')">+ INTERV.</button>
  </div>
  <div class="cards-list" id="intervList" style="padding-top:0"></div>
</div>

<!-- MODALS                                                   -->
<!-- ═══════════════════════════════════════════════════════ -->

<!-- MODAL CLIENT -->
<div class="form-modal" id="modalClient">
  <div class="form-sheet">
    <div class="form-title" id="modalClientTitle">NOUVEAU CLIENT <button class="btn-close-modal" onclick="closeModal('modalClient')">✕</button></div>
    <input type="hidden" id="inputClientId">
    <div class="form-group"><label>Nom complet *</label><input type="text" id="inputNom" placeholder="Ex: Valentin Dupont"></div>
    <div class="form-group"><label>Téléphone</label><input type="tel" id="inputTel" placeholder="06 xx xx xx xx"></div>
    <div class="form-group"><label>Email</label><input type="email" id="inputEmail" placeholder="email@exemple.com"></div>
    <div class="form-group"><label>Adresse</label><textarea id="inputAdresse" placeholder="Adresse du client..." style="min-height:60px"></textarea></div>
    <div class="form-group"><label>Notes</label><textarea id="inputNotes" placeholder="Informations complémentaires..."></textarea></div>
    <button class="btn-submit" id="btnSaveClient" onclick="saveClient()">ENREGISTRER</button>
  </div>
</div>

<!-- MODAL VÉHICULE -->
<div class="form-modal" id="modalVehicule">
  <div class="form-sheet">
    <div class="form-title" id="modalVehiculeTitle">NOUVEAU VÉHICULE <button class="btn-close-modal" onclick="closeModal('modalVehicule')">✕</button></div>
    <input type="hidden" id="inputVehiculeId">
    <div class="form-group"><label>Plaque d'immatriculation</label><input type="text" id="inputPlaque" placeholder="Ex: AB-123-CD" style="text-transform:uppercase" oninput="formatPlaque(this)" maxlength="9"></div>
    <div class="form-group"><label>Marque & Modèle *</label><input type="text" id="inputVehicule" placeholder="Ex: Peugeot 207 1.4 HDi"></div>
    <div class="form-group"><label>Année</label><input type="number" id="inputAnnee" placeholder="Ex: 2018" min="1900" max="2030"></div>
    <div class="form-group"><label>Kilométrage</label><input type="number" id="inputKm" placeholder="Ex: 85000"></div>
    <div class="form-group"><label>Couleur</label><input type="text" id="inputCouleur" placeholder="Ex: Blanc nacré"></div>
    <div class="form-group"><label>VIN / N° de série</label><input type="text" id="inputVin" placeholder="Ex: VF1234567890..."></div>
    <div class="form-group"><label>Notes véhicule</label><textarea id="inputVehNotes" placeholder="Observations, équipements spéciaux..."></textarea></div>
    <button class="btn-submit" id="btnSaveVehicule" onclick="saveVehicule()">ENREGISTRER</button>
  </div>
</div>

<!-- MODAL INTERVENTION -->
<div class="form-modal" id="modalInterv">
  <div class="form-sheet">
    <div class="form-title" id="modalIntervTitle">NOUVELLE INTERVENTION <button class="btn-close-modal" onclick="closeModal('modalInterv')">✕</button></div>
    <input type="hidden" id="inputIntervId">
    <div class="form-group"><label>Date</label><input type="date" id="inputDate"></div>
    <div class="form-group"><label>Titre / Type *</label><input type="text" id="inputIntervTitre" placeholder="Ex: Révision, Freins, Suspension..."></div>
    <div class="form-group"><label>Statut</label>
      <select id="inputIntervStatut">
        <option value="afaire">🔴 À faire</option>
        <option value="encours">🟡 En cours</option>
        <option value="termine">🟢 Terminé</option>
      </select>
    </div>
    <div class="form-group"><label>Détails des travaux</label><textarea id="inputIntervDetail" placeholder="Pièces changées, remarques, kilométrage..."></textarea></div>
    <div class="form-group"><label>Montant (€)</label><input type="number" id="inputIntervMontant" placeholder="Ex: 482.80" step="0.01"></div>
    <div class="form-group">
      <label>Documents (PDF / Photos)</label>
      <div class="upload-zone" onclick="document.getElementById('inputFile').click()">
        📎 Appuyer pour joindre un fichier
        <input type="file" id="inputFile" accept=".pdf,.png,.jpg,.jpeg" multiple onchange="handleFiles(this)">
      </div>
      <div id="filePreview" style="margin-top:8px"></div>
    </div>
    <button class="btn-submit" id="btnSaveInterv" onclick="saveInterv()">ENREGISTRER</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- BULLE NOTES GLOBALES (menu principal) -->
<button class="notes-fab" id="fabGlobal" onclick="toggleNotes('global')" style="display:none">
  📝<span class="notes-badge" id="badgeGlobal" style="display:none">0</span>
</button>
<div class="notes-panel" id="panelGlobal">
  <div class="notes-panel-header">
    <span class="notes-panel-title">📝 PENSE-BÊTE</span>
    <button class="btn-close-modal" onclick="toggleNotes('global')">✕</button>
  </div>
  <div class="notes-list" id="listGlobal"></div>
  <div class="notes-input-area">
    <textarea id="inputNoteGlobal" placeholder="Écrire une note..." rows="1" oninput="autoResize(this)"></textarea>
    <button class="btn-send-note" onclick="addNote('global')">➤</button>
  </div>
</div>

<!-- BULLE NOTES CLIENT (fiche client) -->
<button class="notes-fab" id="fabClient" onclick="toggleNotes('client')" style="display:none">
  📋<span class="notes-badge" id="badgeClient" style="display:none">0</span>
</button>
<div class="notes-panel" id="panelClient">
  <div class="notes-panel-header">
    <span class="notes-panel-title" id="panelClientTitle">📋 NOTES CLIENT</span>
    <button class="btn-close-modal" onclick="toggleNotes('client')">✕</button>
  </div>
  <div class="notes-list" id="listClient"></div>
  <div class="notes-input-area">
    <textarea id="inputNoteClient" placeholder="Note sur ce client..." rows="1" oninput="autoResize(this)"></textarea>
    <button class="btn-send-note" onclick="addNote('client')">➤</button>
  </div>
</div>

<script>
  // ─── HELPERS TITRES MODALS ────────────────────────────────
  function setModalTitle(elId, txt, modalId) {
    const btn = '<button class="btn-close-modal" onclick="closeModal(\"' + modalId + '\")">✕</button>';
    document.getElementById(elId).innerHTML = txt + ' ' + btn;
  }


  // ─── CONFIG ────────────────────────────────────────────────
  const SUPABASE_URL = 'https://valcdtfgziijidmitrmy.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZhbGNkdGZnemlpamlkbWl0cm15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NTU0MTQsImV4cCI6MjA5MzEzMTQxNH0.DyRGowpmB2O3uzQgcN3jq-cIS9Onf7YDKEQZ5WavwMk';
  const USERS = { 'bsp': 'vvvv' };

  const hdrs = {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
    'Prefer': 'return=representation'
  };

  // ─── SUPABASE HELPERS ──────────────────────────────────────
  async function sbGet(table, params='') {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}${params}`, {headers: hdrs});
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }
  async function sbPost(table, body) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {method:'POST', headers:hdrs, body:JSON.stringify(body)});
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }
  async function sbPatch(table, id, body) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {method:'PATCH', headers:hdrs, body:JSON.stringify(body)});
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }
  async function sbDelete(table, id) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {method:'DELETE', headers:hdrs});
    if (!r.ok) throw new Error(await r.text());
  }

  // ─── STATE ─────────────────────────────────────────────────
  let clients = [];
  let vehicules = [];
  let interventions = [];
  let currentClientId = null;
  let currentVehiculeId = null;
  let pendingFiles = [];
  let filtreActif = 'tous';

  // ─── LOGIN ─────────────────────────────────────────────────
  function doLogin() {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value;
    const err = document.getElementById('loginError');
    if (USERS[user] && USERS[user] === pass) {
      currentNoteUser = user;
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('fabGlobal').style.display = 'flex';
      renderNotes('global');
      load();
    } else {
      err.classList.add('show');
      document.getElementById('loginPass').value = '';
      setTimeout(() => err.classList.remove('show'), 3000);
    }
  }

  // ─── TOAST ─────────────────────────────────────────────────
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function setDbStatus(ok) {
    const el = document.getElementById('dbStatus');
    el.textContent = ok ? '🟢' : '🔴';
    el.className = 'db-status ' + (ok ? 'db-ok' : 'db-err');
  }

  // ─── NAVIGATION ────────────────────────────────────────────
  function goTo(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    window.scrollTo(0,0);
    document.getElementById('panelGlobal').classList.remove('open');
    document.getElementById('panelClient').classList.remove('open');
    document.getElementById('fabGlobal').style.display = (pageId === 'pageClients') ? 'flex' : 'none';
    document.getElementById('fabClient').style.display = (pageId === 'pageClient') ? 'flex' : 'none';
    if (pageId === 'pageClient') {
      const nom = document.getElementById('clientNom').textContent;
      document.getElementById('panelClientTitle').textContent = '📋 NOTES — ' + nom;
      renderNotes('client');
    }
  }

  // ─── LOAD ──────────────────────────────────────────────────
  async function load() {
    try {
      const [cls, vehs, intervs] = await Promise.all([
        sbGet('bsp_clients', '?order=created_at.asc'),
        sbGet('bsp_vehicules', '?order=created_at.asc'),
        sbGet('bsp_interventions', '?order=created_at.asc')
      ]);
      clients = cls;
      vehicules = vehs;
      interventions = intervs;
      setDbStatus(true);
      renderClients();
    } catch(e) {
      console.error(e);
      setDbStatus(false);
      showToast('🔴 Hors ligne');
    }
  }

  // ─── RENDER CLIENTS ────────────────────────────────────────
  function renderClients() {
    const q = (document.getElementById('searchInput').value || '').toLowerCase();
    const list = document.getElementById('clientsList');
    const filtered = clients.filter(c =>
      (c.nom||'').toLowerCase().includes(q) ||
      (c.tel||'').toLowerCase().includes(q)
    );
    document.getElementById('clientCount').textContent = `${clients.length} client${clients.length !== 1 ? 's' : ''}`;
    if (!filtered.length) {
      list.innerHTML = `<div class="empty"><div class="empty-icon">🏎️</div><h3>${clients.length ? 'Aucun résultat' : 'Aucun client'}</h3><p style="margin-top:8px;font-size:13px;color:#555">Ajoute ton premier client avec le bouton <b style="color:var(--or)">+ CLIENT</b></p></div>`;
      return;
    }
    list.innerHTML = filtered.map(c => {
      const vehsClient = vehicules.filter(v => v.client_id === c.id);
      const nb = vehsClient.length;
      const intervClient = interventions.filter(iv => vehsClient.some(v => v.id === iv.vehicule_id));
      const nbAfaire = intervClient.filter(iv => (iv.statut||'afaire') === 'afaire').length;
      const nbEncours = intervClient.filter(iv => iv.statut === 'encours').length;
      return `
        <div class="client-card" onclick="openClient('${c.id}')">
          <div class="client-info">
            <h3>${c.nom}</h3>
            ${c.tel ? `<div class="client-meta">📞 ${c.tel}</div>` : ''}
            ${c.email ? `<div class="client-meta">✉️ ${c.email}</div>` : ''}
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
              ${nb ? `<span class="badge">🚗 ${nb} véhicule${nb>1?'s':''}</span>` : ''}
              ${nbAfaire ? `<span class="badge-statut statut-afaire">🔴 ${nbAfaire} à faire</span>` : ''}
              ${nbEncours ? `<span class="badge-statut statut-encours">🟡 ${nbEncours} en cours</span>` : ''}
            </div>
          </div>
          <span class="client-arrow">›</span>
        </div>`;
    }).join('');
  }

  // ─── OPEN CLIENT ───────────────────────────────────────────
  function openClient(id) {
    currentClientId = id;
    const c = clients.find(x => x.id === id);
    if (!c) return;
    document.getElementById('clientNom').textContent = c.nom;
    document.getElementById('clientMeta').textContent = c.tel || c.email || '';

    const box = document.getElementById('clientInfoBox');
    box.innerHTML = `
      <div class="info-box-title">INFORMATIONS CLIENT
        <button style="background:none;border:1px solid var(--or);color:var(--or);border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer" onclick="openEditClient()">✏️ Modifier</button>
      </div>
      ${c.tel ? `<div class="info-row"><span>Téléphone</span><span>${c.tel}</span></div>` : ''}
      ${c.email ? `<div class="info-row"><span>Email</span><span>${c.email}</span></div>` : ''}
      ${c.adresse ? `<div class="info-row"><span>Adresse</span><span>${c.adresse}</span></div>` : ''}
      ${c.notes ? `<div class="info-row"><span>Notes</span><span>${c.notes}</span></div>` : ''}
    `;

    renderVehicules();
    goTo('pageClient');
  }

  // ─── RENDER VEHICULES ──────────────────────────────────────
  function renderVehicules() {
    const list = document.getElementById('vehiculesList');
    const vehsClient = vehicules.filter(v => v.client_id === currentClientId);
    if (!vehsClient.length) {
      list.innerHTML = '<div class="empty"><div class="empty-icon">🚗</div><h3>Aucun véhicule</h3><p style="margin-top:8px;font-size:13px;color:#555">Ajoute un véhicule avec le bouton <b style="color:var(--or)">+ VÉHICULE</b></p></div>';
      return;
    }
    list.innerHTML = vehsClient.map(v => {
      const intervVeh = interventions.filter(iv => iv.vehicule_id === v.id);
      const nb = intervVeh.length;
      const nbAfaire = intervVeh.filter(iv => (iv.statut||'afaire') === 'afaire').length;
      const nbEncours = intervVeh.filter(iv => iv.statut === 'encours').length;
      return `
        <div class="vehicule-card" onclick="openVehicule('${v.id}')">
          <div class="veh-info">
            <span class="veh-plate">${v.plaque || '—'}</span>
            <h3>${v.modele || '—'}</h3>
            ${v.annee ? `<div class="veh-meta">📅 ${v.annee}${v.km ? ` · 🛣️ ${parseInt(v.km).toLocaleString()} km` : ''}</div>` : ''}
            ${v.couleur ? `<div class="veh-meta">🎨 ${v.couleur}</div>` : ''}
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
              ${nb ? `<span class="badge">🔧 ${nb} intervention${nb>1?'s':''}</span>` : ''}
              ${nbAfaire ? `<span class="badge-statut statut-afaire">🔴 ${nbAfaire} à faire</span>` : ''}
              ${nbEncours ? `<span class="badge-statut statut-encours">🟡 ${nbEncours} en cours</span>` : ''}
            </div>
          </div>
          <span class="client-arrow">›</span>
        </div>`;
    }).join('');
  }

  // ─── OPEN VEHICULE ─────────────────────────────────────────
  function openVehicule(id) {
    currentVehiculeId = id;
    const v = vehicules.find(x => x.id === id);
    if (!v) return;
    document.getElementById('vehNom').textContent = v.modele || '—';
    document.getElementById('vehPlaque').textContent = v.plaque || '—';

    const box = document.getElementById('vehInfoBox');
    box.innerHTML = `
      <div class="info-box-title">DÉTAILS VÉHICULE
        <button style="background:none;border:1px solid var(--or);color:var(--or);border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer" onclick="openEditVehicule()">✏️ Modifier</button>
      </div>
      ${v.plaque ? `<div class="info-row"><span>Plaque</span><span>${v.plaque}</span></div>` : ''}
      ${v.annee ? `<div class="info-row"><span>Année</span><span>${v.annee}</span></div>` : ''}
      ${v.km ? `<div class="info-row"><span>Kilométrage</span><span>${parseInt(v.km).toLocaleString()} km</span></div>` : ''}
      ${v.couleur ? `<div class="info-row"><span>Couleur</span><span>${v.couleur}</span></div>` : ''}
      ${v.vin ? `<div class="info-row"><span>VIN</span><span style="font-size:11px">${v.vin}</span></div>` : ''}
      ${v.notes ? `<div class="info-row"><span>Notes</span><span>${v.notes}</span></div>` : ''}
    `;

    filtreActif = 'tous';
    document.querySelectorAll('.filtre-btn').forEach((b,i) => b.classList.toggle('active', i===0));
    renderIntervs();
    goTo('pageVehicule');
  }

  // ─── RENDER INTERVENTIONS ──────────────────────────────────
  function renderIntervs() {
    const list = document.getElementById('intervList');
    let intervs = interventions.filter(iv => iv.vehicule_id === currentVehiculeId);
    if (filtreActif !== 'tous') intervs = intervs.filter(iv => (iv.statut||'afaire') === filtreActif);
    intervs = intervs.slice().reverse();

    if (!intervs.length) {
      list.innerHTML = '<div class="no-interv">Aucune intervention enregistrée</div>';
      return;
    }

    list.innerHTML = intervs.map(iv => {
      const docs = (iv.docs||[]).map(d => `
        <div class="doc-item">
          <span>📄</span>
          <a href="${d.data}" download="${d.name}">${d.name}</a>
          <button class="btn-del-doc" onclick="deleteDoc('${iv.id}','${d.id}')">✕</button>
        </div>`).join('');
      const statut = iv.statut || 'afaire';
      const statutLabel = statut==='afaire'?'🔴 À faire':statut==='encours'?'🟡 En cours':'🟢 Terminé';
      const statutClass = statut==='afaire'?'statut-afaire':statut==='encours'?'statut-encours':'statut-termine';
      return `
        <div class="interv-card">
          <div class="interv-head" onclick="toggleInterv('iv_${iv.id}')">
            <div>
              <div class="interv-date">${iv.date || '—'}</div>
              <div class="interv-title-text">${iv.titre || 'Intervention'}</div>
              ${iv.montant ? `<div style="font-size:12px;color:var(--or);margin-top:2px">💰 ${parseFloat(iv.montant).toFixed(2)} €</div>` : ''}
              <span class="badge-statut ${statutClass}">${statutLabel}</span>
            </div>
            <span class="interv-chevron" id="chev_${iv.id}">▾</span>
          </div>
          <div class="interv-body" id="iv_${iv.id}">
            ${iv.detail ? `<div class="interv-detail">${iv.detail}</div>` : ''}
            ${docs ? `<div class="interv-docs">${docs}</div>` : ''}
            <div class="interv-actions">
              <button class="btn-edit-interv" onclick="openEditInterv('${iv.id}')">✏️ Modifier</button>
              <button class="btn-del-interv" onclick="deleteInterv('${iv.id}')">🗑 Supprimer</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function toggleInterv(id) {
    const body = document.getElementById(id);
    const chev = document.getElementById('chev_' + id.replace('iv_',''));
    if (body) body.classList.toggle('open');
    if (chev) chev.classList.toggle('open');
  }

  function setFiltre(f, e) {
    filtreActif = f;
    document.querySelectorAll('.filtre-btn').forEach(b => b.classList.remove('active'));
    if (e && e.target) e.target.classList.add('active');
    renderIntervs();
  }

  // ─── MODALS ────────────────────────────────────────────────
  function openModal(id) { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }

  // ─── SAVE CLIENT ───────────────────────────────────────────
  function openEditClient() {
    const c = clients.find(x => x.id === currentClientId);
    if (!c) return;
    document.getElementById('inputClientId').value = c.id;
    setModalTitle('modalClientTitle', 'MODIFIER CLIENT', 'modalClient');
    document.getElementById('inputNom').value = c.nom || '';
    document.getElementById('inputTel').value = c.tel || '';
    document.getElementById('inputEmail').value = c.email || '';
    document.getElementById('inputAdresse').value = c.adresse || '';
    document.getElementById('inputNotes').value = c.notes || '';
    openModal('modalClient');
  }

  async function saveClient() {
    const nom = document.getElementById('inputNom').value.trim();
    if (!nom) { alert('Le nom est requis.'); return; }
    const btn = document.getElementById('btnSaveClient');
    btn.disabled = true; btn.textContent = 'Enregistrement...';
    const id = document.getElementById('inputClientId').value;
    const data = {
      nom,
      tel: document.getElementById('inputTel').value.trim(),
      email: document.getElementById('inputEmail').value.trim(),
      adresse: document.getElementById('inputAdresse').value.trim(),
      notes: document.getElementById('inputNotes').value.trim()
    };
    try {
      if (id) {
        await sbPatch('bsp_clients', id, data);
        const c = clients.find(x => x.id === id);
        if (c) Object.assign(c, data);
        showToast('✅ Client modifié !');
        openClient(id);
      } else {
        const [newC] = await sbPost('bsp_clients', data);
        clients.push(newC);
        renderClients();
        showToast('✅ Client ajouté !');
      }
      document.getElementById('inputClientId').value = '';
      setModalTitle('modalClientTitle', 'NOUVEAU CLIENT', 'modalClient');
      document.getElementById('inputNom').value = '';
      document.getElementById('inputTel').value = '';
      document.getElementById('inputEmail').value = '';
      document.getElementById('inputAdresse').value = '';
      document.getElementById('inputNotes').value = '';
      closeModal('modalClient');
    } catch(e) {
      console.error(e);
      showToast('🔴 Erreur de sauvegarde');
    } finally {
      btn.disabled = false; btn.textContent = 'ENREGISTRER';
    }
  }

  async function deleteClient() {
    if (!confirm('Supprimer ce client et tous ses véhicules/interventions ?')) return;
    try {
      await sbDelete('bsp_clients', currentClientId);
      clients = clients.filter(x => x.id !== currentClientId);
      vehicules = vehicules.filter(x => x.client_id !== currentClientId);
      renderClients();
      goTo('pageClients');
      showToast('🗑 Client supprimé');
    } catch(e) { showToast('🔴 Erreur'); }
  }

  // ─── SAVE VEHICULE ─────────────────────────────────────────
  function openEditVehicule() {
    const v = vehicules.find(x => x.id === currentVehiculeId);
    if (!v) return;
    document.getElementById('inputVehiculeId').value = v.id;
    setModalTitle('modalVehiculeTitle', 'MODIFIER VÉHICULE', 'modalVehicule');
    document.getElementById('inputPlaque').value = v.plaque || '';
    document.getElementById('inputVehicule').value = v.modele || '';
    document.getElementById('inputAnnee').value = v.annee || '';
    document.getElementById('inputKm').value = v.km || '';
    document.getElementById('inputCouleur').value = v.couleur || '';
    document.getElementById('inputVin').value = v.vin || '';
    document.getElementById('inputVehNotes').value = v.notes || '';
    openModal('modalVehicule');
  }

  async function saveVehicule() {
    const modele = document.getElementById('inputVehicule').value.trim();
    if (!modele) { alert('Le modèle est requis.'); return; }
    const btn = document.getElementById('btnSaveVehicule');
    btn.disabled = true; btn.textContent = 'Enregistrement...';
    const id = document.getElementById('inputVehiculeId').value;
    const data = {
      modele,
      plaque: document.getElementById('inputPlaque').value.trim().toUpperCase(),
      annee: document.getElementById('inputAnnee').value || null,
      km: document.getElementById('inputKm').value || null,
      couleur: document.getElementById('inputCouleur').value.trim(),
      vin: document.getElementById('inputVin').value.trim(),
      notes: document.getElementById('inputVehNotes').value.trim()
    };
    try {
      if (id) {
        await sbPatch('bsp_vehicules', id, data);
        const v = vehicules.find(x => x.id === id);
        if (v) Object.assign(v, data);
        openVehicule(id);
        showToast('✅ Véhicule modifié !');
      } else {
        const [newV] = await sbPost('bsp_vehicules', {...data, client_id: currentClientId});
        vehicules.push(newV);
        renderVehicules();
        showToast('✅ Véhicule ajouté !');
      }
      document.getElementById('inputVehiculeId').value = '';
      setModalTitle('modalVehiculeTitle', 'NOUVEAU VÉHICULE', 'modalVehicule');
      closeModal('modalVehicule');
    } catch(e) {
      console.error(e);
      showToast('🔴 Erreur de sauvegarde');
    } finally {
      btn.disabled = false; btn.textContent = 'ENREGISTRER';
    }
  }

  async function deleteVehicule() {
    if (!confirm('Supprimer ce véhicule et toutes ses interventions ?')) return;
    try {
      await sbDelete('bsp_vehicules', currentVehiculeId);
      vehicules = vehicules.filter(x => x.id !== currentVehiculeId);
      interventions = interventions.filter(x => x.vehicule_id !== currentVehiculeId);
      renderVehicules();
      goTo('pageClient');
      showToast('🗑 Véhicule supprimé');
    } catch(e) { showToast('🔴 Erreur'); }
  }

  // ─── SAVE INTERVENTION ─────────────────────────────────────
  function openEditInterv(ivId) {
    const iv = interventions.find(x => x.id === ivId);
    if (!iv) return;
    document.getElementById('inputIntervId').value = ivId;
    setModalTitle('modalIntervTitle', 'MODIFIER INTERVENTION', 'modalInterv');
    document.getElementById('inputDate').value = iv.date || '';
    document.getElementById('inputIntervTitre').value = iv.titre || '';
    document.getElementById('inputIntervDetail').value = iv.detail || '';
    document.getElementById('inputIntervMontant').value = iv.montant || '';
    document.getElementById('inputIntervStatut').value = iv.statut || 'afaire';
    pendingFiles = [...(iv.docs||[])];
    document.getElementById('filePreview').innerHTML = pendingFiles.map(d => `<div class="doc-item"><span>📄</span><span style="flex:1;color:var(--texte2)">${d.name}</span></div>`).join('');
    openModal('modalInterv');
  }

  function handleFiles(input) {
    const preview = document.getElementById('filePreview');
    Array.from(input.files).forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        pendingFiles.push({ id: Date.now().toString()+Math.random(), name: file.name, data: e.target.result });
        preview.innerHTML += `<div class="doc-item"><span>📄</span><span style="flex:1;color:var(--texte2)">${file.name}</span></div>`;
      };
      reader.readAsDataURL(file);
    });
  }

  async function saveInterv() {
    const titre = document.getElementById('inputIntervTitre').value.trim();
    if (!titre) { alert('Le titre est requis.'); return; }
    const btn = document.getElementById('btnSaveInterv');
    btn.disabled = true; btn.textContent = 'Enregistrement...';
    const ivId = document.getElementById('inputIntervId').value;
    const isEdit = !!ivId;
    const data = {
      date: document.getElementById('inputDate').value,
      titre,
      detail: document.getElementById('inputIntervDetail').value.trim(),
      montant: document.getElementById('inputIntervMontant').value || null,
      statut: document.getElementById('inputIntervStatut').value,
      docs: [...pendingFiles]
    };
    try {
      if (isEdit) {
        await sbPatch('bsp_interventions', ivId, data);
        const iv = interventions.find(x => x.id === ivId);
        if (iv) Object.assign(iv, data);
        showToast('✅ Intervention modifiée !');
      } else {
        const [newIv] = await sbPost('bsp_interventions', {...data, vehicule_id: currentVehiculeId});
        interventions.push(newIv);
        showToast('✅ Intervention enregistrée !');
      }
      document.getElementById('inputIntervId').value = '';
      setModalTitle('modalIntervTitle', 'NOUVELLE INTERVENTION', 'modalInterv');
      document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('inputIntervTitre').value = '';
      document.getElementById('inputIntervDetail').value = '';
      document.getElementById('inputIntervMontant').value = '';
      document.getElementById('inputIntervStatut').value = 'afaire';
      document.getElementById('filePreview').innerHTML = '';
      pendingFiles = [];
      renderIntervs();
      closeModal('modalInterv');
    } catch(e) {
      console.error(e);
      showToast('🔴 Erreur de sauvegarde');
    } finally {
      btn.disabled = false; btn.textContent = 'ENREGISTRER';
    }
  }

  async function deleteInterv(ivId) {
    if (!confirm('Supprimer cette intervention ?')) return;
    try {
      await sbDelete('bsp_interventions', ivId);
      interventions = interventions.filter(x => x.id !== ivId);
      renderIntervs();
      showToast('🗑 Intervention supprimée');
    } catch(e) { showToast('🔴 Erreur'); }
  }

  async function deleteDoc(ivId, docId) {
    const iv = interventions.find(x => x.id === ivId);
    if (!iv) return;
    iv.docs = (iv.docs||[]).filter(d => d.id !== docId);
    try {
      await sbPatch('bsp_interventions', ivId, {docs: iv.docs});
    } catch(e) { console.error(e); }
    renderIntervs();
    showToast('🗑 Document supprimé');
  }

  // ─── FORMAT PLAQUE ─────────────────────────────────────────
  function formatPlaque(input) {
    let val = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    let result = '';
    if (val.length <= 2) result = val;
    else if (val.length <= 5) result = val.slice(0,2) + '-' + val.slice(2);
    else result = val.slice(0,2) + '-' + val.slice(2,5) + '-' + val.slice(5,7);
    input.value = result;
  }

  // ─── NOTES SYSTÈME ─────────────────────────────────────────
  let currentNoteUser = 'bsp';

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  function toggleNotes(type) {
    const panel = document.getElementById('panel' + (type === 'global' ? 'Global' : 'Client'));
    panel.classList.toggle('open');
  }

  let notesCache = { global: [], client: [] };

  async function loadNotesGlobal() {
    await fetchNotes('global');
  }

  async function loadNotesClient() {
    await fetchNotes('client');
  }

  async function fetchNotes(type) {
    const listEl = document.getElementById('list' + (type === 'global' ? 'Global' : 'Client'));
    listEl.innerHTML = '<div class="notes-empty">⏳ Chargement...</div>';
    try {
      let params = '?order=created_at.asc';
      if (type === 'global') params += '&type=eq.global';
      else params += '&type=eq.client&client_id=eq.' + currentClientId;
      const notes = await sbGet('bsp_notes', params);
      notesCache[type] = notes;
      renderNotes(type);
    } catch(e) {
      listEl.innerHTML = '<div class="notes-empty">🔴 Erreur de chargement</div>';
    }
  }

  function renderNotes(type) {
    const notes = notesCache[type] || [];
    const listEl = document.getElementById('list' + (type === 'global' ? 'Global' : 'Client'));
    const badge = document.getElementById('badge' + (type === 'global' ? 'Global' : 'Client'));

    if (notes.length === 0) {
      listEl.innerHTML = '<div class="notes-empty">Aucune note pour l\'instant</div>';
    } else {
      listEl.innerHTML = notes.map(n => {
        const d = new Date(n.created_at);
        const dateStr = d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
        return `
        <div class="note-item">
          <div class="note-item-header">
            <span class="note-author">👤 ${n.author}</span>
            <span style="display:flex;align-items:center;gap:6px">
              <span class="note-date">${dateStr}</span>
              <button class="note-del" onclick="deleteNote('${type}', '${n.id}')">🗑</button>
            </span>
          </div>
          <div class="note-text">${n.text.replace(/</g,'&lt;')}</div>
        </div>`;
      }).join('');
      listEl.scrollTop = listEl.scrollHeight;
    }

    if (notes.length > 0) {
      badge.textContent = notes.length;
      badge.style.display = 'flex';
    } else {
      badge.style.display = 'none';
    }
  }

  async function addNote(type) {
    const inputEl = document.getElementById('inputNote' + (type === 'global' ? 'Global' : 'Client'));
    const text = inputEl.value.trim();
    if (!text) return;

    const body = { author: currentNoteUser, text, type };
    if (type === 'client') body.client_id = currentClientId;

    try {
      const [note] = await sbPost('bsp_notes', body);
      notesCache[type].push(note);
      renderNotes(type);
      inputEl.value = '';
      inputEl.style.height = 'auto';
    } catch(e) {
      showToast('🔴 Erreur envoi note');
    }
  }

  async function deleteNote(type, noteId) {
    try {
      await sbDelete('bsp_notes', noteId);
      notesCache[type] = notesCache[type].filter(n => n.id !== noteId);
      renderNotes(type);
    } catch(e) {
      showToast('🔴 Erreur suppression');
    }
  }

  // Fermer panels si clic hors
  document.addEventListener('click', function(e) {
    ['Global','Client'].forEach(t => {
      const panel = document.getElementById('panel' + t);
      const fab = document.getElementById('fab' + t);
      if (panel && panel.classList.contains('open') && !panel.contains(e.target) && e.target !== fab && !fab.contains(e.target)) {
        panel.classList.remove('open');
      }
    });
  });

  // Envoi note avec Ctrl+Enter
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      if (document.getElementById('panelGlobal').classList.contains('open')) addNote('global');
      if (document.getElementById('panelClient').classList.contains('open')) addNote('client');
    }
  });


  // Initialiser le champ date par défaut
  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];
    loadNotesGlobal();
  });
</script>
</body>
</html>
